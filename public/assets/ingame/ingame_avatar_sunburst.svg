<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="90%" stop-color="#fcd34d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="1" />
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Rays -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.85" filter="url(#blurFilter)">
    <line x1="50" y1="2" x2="50" y2="8" />
    <line x1="50" y1="92" x2="50" y2="98" />
    <line x1="2" y1="50" x2="8" y2="50" />
    <line x1="92" y1="50" x2="98" y2="50" />
    <line x1="16" y1="16" x2="21" y2="21" />
    <line x1="79" y1="79" x2="84" y2="84" />
    <line x1="16" y1="84" x2="21" y2="79" />
    <line x1="79" y1="21" x2="84" y2="16" />
    <line x1="32" y1="6" x2="35" y2="12" />
    <line x1="68" y1="6" x2="65" y2="12" />
    <line x1="32" y1="94" x2="35" y2="88" />
    <line x1="68" y1="94" x2="65" y2="88" />
    <line x1="6" y1="32" x2="12" y2="35" />
    <line x1="6" y1="68" x2="12" y2="65" />
    <line x1="94" y1="32" x2="88" y2="35" />
    <line x1="94" y1="68" x2="88" y2="65" />
  </g>

  <!-- Main Ornate Rings -->
  <circle cx="50" cy="50" r="44" stroke="#d97706" stroke-width="1.5" opacity="0.6" />
  <circle cx="50" cy="50" r="42" stroke="#fcd34d" stroke-width="2.5" filter="url(#blurFilter)" />
  <circle cx="50" cy="50" r="40" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" />
</svg>
